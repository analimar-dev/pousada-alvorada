
<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta
            name="description"
            content="Conheça a Pousada Alvorada em Araxá, Minas Gerais. Consulte a disponibilidade de hospedagem pelo WhatsApp.">

        <meta name="theme-color" content="#fdf9f2">

        <title>Pousada Alvorada | Hospedagem em Araxá - MG</title>

        <link
            rel="icon"
            href="images/favicon/favicon.ico">

        <link
            rel="stylesheet"
            href="css/style.css">

        <script src="js/script.js" defer></script>
    </head>

    <body>

        <!-- CABEÇALHO -->
        <header class="cabecalho" id="inicio">

            <div class="cabecalho__container">

                <!-- LOGOTIPO -->
                <a
                    class="cabecalho__logo"
                    href="#inicio"
                    aria-label="Pousada Alvorada — página inicial">
                    <img
                        src="images/logo/logo.webp"
                        alt="Hotel e Pousada Alvorada"
                        width="180"
                        height="90">
                </a>

                <!-- BOTÃO DO MENU HAMBÚRGUER -->
                <button
                    class="menu__botao"
                    type="button"
                    aria-label="Abrir menu de navegação"
                    aria-controls="navegacao-principal"
                    aria-expanded="false">
                    <span class="menu__linha"></span>
                    <span class="menu__linha"></span>
                    <span class="menu__linha"></span>
                </button>

                <!-- NAVEGAÇÃO PRINCIPAL -->
                <nav
                    class="navegacao"
                    id="navegacao-principal"
                    aria-label="Navegação principal">

                    <ul class="navegacao__lista">

                        <li>
                            <a
                                class="navegacao__link"
                                href="#inicio"
                                aria-current="page">
                                Início
                            </a>
                        </li>

                        <li>
                            <a
                                class="navegacao__link"
                                href="#sobre">
                                A pousada
                            </a>
                        </li>

                        <li>
                            <a
                                class="navegacao__link"
                                href="#quartos">
                                Quartos
                            </a>
                        </li>

                        <li>
                            <a
                                class="navegacao__link"
                                href="#localizacao">
                                Localização
                            </a>
                        </li>

                    </ul>

                </nav>

                <!-- BOTÃO DE AGENDAMENTO PELO WHATSAPP -->
                <a
                    class="cabecalho__agendamento"
                    href="https://wa.me/5534988516822?text=Ol%C3%A1%2C%20Ieda!%20Gostaria%20de%20consultar%20a%20disponibilidade%20da%20Pousada%20Alvorada."
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Consultar disponibilidade da Pousada Alvorada pelo WhatsApp">

                    <svg
                        class="cabecalho__agendamento-icone"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        focusable="false">
                        <path
                            d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.5 0 .2 5.3.2 11.8c0 2.1.6 4.2 1.6 6L0 24l6.4-1.7a12 12 0 0 0 5.7 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.3-6.2-3.5-8.4ZM12.1 21.7a9.9 9.9 0 0 1-5-1.3l-.4-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 0 1-1.5-5.3c0-5.4 4.4-9.8 9.8-9.8 2.6 0 5.1 1 6.9 2.9a9.7 9.7 0 0 1 2.9 6.9c0 5.5-4.3 9.9-9.7 9.9Zm5.4-7.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.8.9-.9 1.1-.2.2-.4.2-.7.1-.3-.2-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6-.1-.2-.7-1.6-.9-2.1-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.5s1.1 2.8 1.3 3c.2.2 2.2 3.3 5.3 4.6.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4Z" />
                    </svg>

                    <span>Agendar hospedagem</span>

                </a>

            </div>

        </header>

        <!-- CONTEÚDO PRINCIPAL -->
        <main id="conteudo-principal">

            <!-- BANNER PRINCIPAL -->
            <section class="banner" aria-labelledby="banner-titulo">

                <div class="banner__container">

                    <!-- TEXTO DO BANNER -->
                    <div class="banner__conteudo">

                        <h1 class="banner__titulo" id="banner-titulo">
                            Pousada
                            <span class="banner__titulo-destaque">
                                Alvorada
                            </span>
                        </h1>

                        <h2 class="banner__subtitulo">
                            Hospedagem simples e econômica em Araxá
                        </h2>

                        <span
                            class="banner__detalhe"
                            aria-hidden="true">
                        </span>

                        <p class="banner__descricao">
                            Uma opção prática e acolhedora para quem está
                            de passagem, vem a trabalho ou precisa de uma
                            estadia tranquila na cidade.
                        </p>

                        <a
                            class="banner__botao"
                            href="https://wa.me/5534988516822?text=Ol%C3%A1%21%20Gostaria%20de%20consultar%20a%20disponibilidade%20de%20hospedagem%20na%20Pousada%20Alvorada.%20Poderiam%20me%20informar%20as%20datas%20dispon%C3%ADveis%20e%20os%20valores%3F"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Consultar disponibilidade de hospedagem pelo WhatsApp">

                            <svg
                                class="banner__botao-icone"
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                                focusable="false">

                                <path
                                    fill="currentColor"
                                    d="M20.52 3.48A11.78 11.78 0 0 0 12.12 0C5.58 0 .25 5.33.25 11.87c0 2.09.55 4.13 1.6 5.94L.15 24l6.34-1.66a11.86 11.86 0 0 0 5.63 1.43h.01c6.54 0 11.87-5.33 11.87-11.87 0-3.17-1.23-6.15-3.48-8.42ZM12.13 21.7h-.01a9.85 9.85 0 0 1-5.02-1.37l-.36-.21-3.76.98 1-3.66-.24-.38a9.83 9.83 0 0 1-1.51-5.19c0-5.46 4.44-9.9 9.9-9.9a9.83 9.83 0 0 1 7.01 2.9 9.83 9.83 0 0 1 2.9 7c0 5.46-4.44 9.9-9.91 9.9Zm5.43-7.41c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.21 5.08 4.5.71.31 1.26.5 1.69.64.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z" />
                            </svg>

                            <span class="banner__botao-texto">
                                Consultar disponibilidade<br>
                                no WhatsApp
                            </span>

                            <span
                                class="banner__botao-seta"
                                aria-hidden="true">
                                &#8250;
                            </span>

                        </a>

                    </div>

                    <!-- FOTO PRINCIPAL -->
                    <div class="banner__imagem">
                        <img
                            src="images/fotos/banner.webp"
                            alt="Fachada da Pousada Alvorada em Araxá, Minas Gerais"
                            width="1200"
                            height="700"
                            fetchpriority="high">
                    </div>

                </div>

            </section>

        </main>

    </body>
</html>
